name: Run Backtest

on:
  push:
    paths:
      - 'backtest-requests/**.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backtest:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diagnostics
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "API key set: $( [ -n '${{ secrets.TRADER_DEV_API_KEY }}' ] && echo YES || echo NO )"
          echo "Pending files:"
          grep -rl '"status"' backtest-requests/ || echo "  none"

      - name: Run pending backtests
        env:
          TRADER_DEV_API_KEY: ${{ secrets.TRADER_DEV_API_KEY }}
        run: |
          pending=$(grep -rl '"status"[[:space:]]*:[[:space:]]*"pending"' backtest-requests/ 2>/dev/null || true)
          echo "Pending: ${pending:-none}"
          for req in $pending; do
            echo "==> $req"
            node runner/run-backtest.js "$req" || echo "FAILED: $req"
          done

      - name: Commit and push results
        run: |
          git config user.email "runner@claude-mandar"
          git config user.name "Backtest Runner"
          git add backtest-requests/ backtest_results/
          git diff --staged --quiet && echo "Nothing to commit." || \
            (git commit -m "Backtest results: $(date '+%Y-%m-%d %H:%M')" && \
             git push origin claude/add-trader-dev-mcp-dJbZq)
