name: Run Backtest

on:
  push:
    paths:
      - 'backtest-requests/**.json'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install runner deps
        run: npm install --prefix runner

      - name: Run pending backtests
        env:
          TRADER_DEV_API_KEY: ${{ secrets.TRADER_DEV_API_KEY }}
        run: |
          pending=$(grep -rEl '"status"\s*:\s*"pending"' backtest-requests/ 2>/dev/null || true)
          echo "Pending: ${pending:-none}"
          for req in $pending; do
            echo "==> $req"
            node runner/run-backtest.js "$req" || echo "FAILED: $req"
          done

      - name: Commit and push results
        run: |
          git config user.email "runner@claude-mandar"
          git config user.name "Backtest Runner"
          git add backtest-requests/ backtest_results/
          git diff --staged --quiet && echo "Nothing to commit." || \
            (git commit -m "Backtest results: $(date '+%Y-%m-%d %H:%M')" && \
             git push origin HEAD:claude/add-trader-dev-mcp-dJbZq)
