name: Run Backtest

on:
  push:
    paths:
      - 'backtest-requests/**.json'

jobs:
  backtest:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          # Add homebrew to PATH for this and all subsequent steps
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/usr/local/bin"    >> $GITHUB_PATH
          # Pass API key via env file
          echo "TRADER_DEV_API_KEY=${{ secrets.TRADER_DEV_API_KEY }}" >> $GITHUB_ENV

      - name: Diagnostics
        run: |
          echo "Node: $(node --version 2>&1 || echo NOT FOUND)"
          echo "curl: $(curl --version 2>&1 | head -1 || echo NOT FOUND)"
          echo "API key set: $( [ -n "$TRADER_DEV_API_KEY" ] && echo YES || echo NO )"

      - name: Find and run pending requests
        run: |
          pending=$(grep -rl '"status"[[:space:]]*:[[:space:]]*"pending"' backtest-requests/ 2>/dev/null || true)
          echo "Pending: ${pending:-none}"
          for req in $pending; do
            echo "==> $req"
            node runner/run-backtest.js "$req"
          done

      - name: Commit and push results
        run: |
          git config user.email "runner@claude-mandar"
          git config user.name "Backtest Runner"
          git add backtest-requests/ backtest_results/
          git diff --staged --quiet && echo "Nothing to commit." || \
            (git commit -m "Backtest results: $(date '+%Y-%m-%d %H:%M')" && \
             git push origin claude/add-trader-dev-mcp-dJbZq)
