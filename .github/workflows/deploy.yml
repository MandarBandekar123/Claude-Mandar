name: Deploy to EC2

on:
  push:
    branches:
      - claude/add-trader-dev-mcp-dJbZq
    paths:
      - 'bot/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 47.129.55.50 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key ec2-user@47.129.55.50 \
            "cd /home/ec2-user/f40d-bot && \
             git pull origin claude/add-trader-dev-mcp-dJbZq && \
             pm2 restart f40d-bot && \
             sleep 5 && \
             pm2 logs f40d-bot --lines 5 --nostream"
